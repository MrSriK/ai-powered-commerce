# ─────────────────────────────────────────────────────────────────────────────
# Environment variables read by the application.
# Local values come from .env (loaded via spring.config.import below, gitignored).
# Production values are injected by the deployment environment.
#
#   SPRING_DATASOURCE_URL          JDBC url
#   SPRING_DATASOURCE_USERNAME     database user
#   SPRING_DATASOURCE_PASSWORD     database password  (SECRET)
#   APP_AUTH_AUDIENCE              Auth0 API audience  e.g. https://api.my-app.com
#   AUTH0_CLIENT_ID                Auth0 Application Client ID
#   AUTH0_CLIENT_SECRET            Auth0 Application Client Secret  (SECRET)
#   AUTH0_DOMAIN                   Auth0 tenant domain  e.g. dev-xxx.us.auth0.com
#   AUTH0_CONNECTION               Auth0 DB connection name  e.g. Username-Password-Authentication
#   APP_INTERNAL_API_KEY           shared secret for /internal endpoints  (SECRET)
#   SPRING_AI_GOOGLE_GENAI_API_KEY Google AI Studio key  (SECRET)
#   SPRING_AI_GOOGLE_GENAI_CHAT_MODEL  Gemini model name  e.g. gemini-1.5-pro
#
# Placeholder strategy (D-54): values with no safe default use ${ENV_VAR} with
# no fallback so a missing value fails fast at startup, naming the missing variable.
# ─────────────────────────────────────────────────────────────────────────────
spring.config.import=optional:file:.env[.properties]

spring.application.name=ai-powered-commerce

server.port=3000

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Auth0 JWT resource-server configuration (D-22, D-58) and ROPG proxy settings
# APP_AUTH_AUDIENCE   — the identifier of your Auth0 API, e.g. https://api.my-app.com
app.auth.audience=${APP_AUTH_AUDIENCE}
app.auth.client-id=${AUTH0_CLIENT_ID}
app.auth.client-secret=${AUTH0_CLIENT_SECRET}
app.auth.domain=${AUTH0_DOMAIN}
app.auth.connection=${AUTH0_CONNECTION}

app.internal.api-key=${APP_INTERNAL_API_KEY}

app.ai.provider=spring-ai
app.ai.timeout=30s
app.ai.max-products=50
app.ai.model=${SPRING_AI_GOOGLE_GENAI_CHAT_MODEL}
spring.ai.google.genai.api-key=${SPRING_AI_GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.model=${SPRING_AI_GOOGLE_GENAI_CHAT_MODEL}

app.orders.delivery-delay=PT5M
app.orders.progression-batch-size=100
