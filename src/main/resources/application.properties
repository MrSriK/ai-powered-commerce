# Environment variables read by the application
#   SPRING_DATASOURCE_URL                 JDBC url (optional, local default below)
#   SPRING_DATASOURCE_USERNAME            database user (optional, local default below)
#   SPRING_DATASOURCE_PASSWORD            database password (optional, SECRET outside local development)
#   APP_AUTH_ISSUER_URI                   Auth0 issuer uri, ends with a slash (required, tenant value)
#   APP_AUTH_AUDIENCE                     Auth0 API audience (required, tenant value)
#   APP_INTERNAL_API_KEY                  shared key for /internal endpoints (required, SECRET)
#   SPRING_AI_GOOGLE_GENAI_API_KEY        Google AI Studio API key (required, SECRET)
#   SPRING_AI_GOOGLE_GENAI_CHAT_MODEL     Gemini model name (required, no default committed)
#
# Placeholder strategy: values with no safe default use an explicit ${ENV_VAR} with
# no default, so a missing value fails with "Could not resolve placeholder" naming
# the variable. Datasource values use ${ENV_VAR:default} for local development (D-54).
spring.application.name=ai-powered-commerce

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ai_powered_commerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.auth.issuer-uri=${APP_AUTH_ISSUER_URI}
app.auth.audience=${APP_AUTH_AUDIENCE}

app.internal.api-key=${APP_INTERNAL_API_KEY}

app.ai.provider=spring-ai
app.ai.timeout=30s
app.ai.max-products=50
app.ai.model=${SPRING_AI_GOOGLE_GENAI_CHAT_MODEL}
spring.ai.google.genai.api-key=${SPRING_AI_GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.model=${SPRING_AI_GOOGLE_GENAI_CHAT_MODEL}

app.orders.delivery-delay=PT5M
app.orders.progression-batch-size=100
