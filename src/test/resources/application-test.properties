app.internal.api-key=test-internal-api-key
app.ai.model=test-model-placeholder
app.ai.timeout=500ms
app.ai.max-products=50
spring.ai.google.genai.api-key=test-not-a-real-key
spring.ai.google.genai.chat.model=test-model-placeholder
