# do not depend on environment variables or network access.
# Real JwtDecoder behavior is tested separately in task 15.2.
# The Gemini model is chosen later (D-65); this name is a placeholder.
# The database is NOT overridden here; task 5 adds Testcontainers.
app.auth.audience=https://test-api.example.test
